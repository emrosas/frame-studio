<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Frame Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 824 824'%3E%3Crect width='824' height='824' rx='190' fill='%23111'/%3E%3Cpath d='M162 308V162h146M516 162h146v146M662 516v146H516M308 662H162V516' fill='none' stroke='%23f5f5f4' stroke-width='56' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='412' cy='412' r='116' fill='%23ff5a1f'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #fbfaf9; color: #1c1b19; font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { html, body { background: #161615; color: #ededeb; } }
      /* The page says why when the viewer can't start: pairing failed, or the folder's scenes don't load. */
      #app:not(:has(*)) { white-space: pre-wrap; padding: 24px; }
      #boot-error { position: fixed; inset: 16px; overflow: auto; padding: 14px 16px; border: 1px solid #7a2b31; border-radius: 6px;
        background: #260e10; color: #ffc9cc; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; z-index: 10; }
      #boot-error[hidden] { display: none; }
      #boot-error strong { display: block; margin-bottom: 6px; color: #fff; font: 600 13px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" role="alert" hidden></div>
    <!-- The boot guard is a file of its own: the studio server's page policy allows no inline script. -->
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
