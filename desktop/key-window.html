<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'" />
    <title>Add a key</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --text-2: #6e6e73;
        --line: rgba(0, 0, 0, 0.12);
        --accent: #007aff;
        --error: #c9341f;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --surface: #2c2c2e;
          --text: #f5f5f7;
          --text-2: #98989d;
          --line: rgba(255, 255, 255, 0.14);
          --accent: #0a84ff;
          --error: #ff6b57;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        -webkit-user-select: none;
      }
      .drag {
        height: 36px;
        -webkit-app-region: drag;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 0 24px 20px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--text-2);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-weight: 500;
      }
      input {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        -webkit-user-select: text;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .error {
        min-height: 18px;
        color: var(--error);
      }
      a {
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        height: 30px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      button[type='submit'] {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
        font-weight: 500;
      }
      button:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <form id="entry" autocomplete="off">
      <h1 id="title">Add a key</h1>
      <p>Encrypted by your system and kept on this computer. Scenes, rigs and agents never see it.</p>
      <p>Make a key with a spending limit for Frame Studio alone. You can <a id="page" role="link" tabindex="0">make one at the provider</a>.</p>
      <label>
        API key
        <input id="key" type="password" spellcheck="false" autocapitalize="off" autocomplete="off" required />
      </label>
      <p class="error" id="error" role="alert"></p>
      <footer>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save">Save key</button>
      </footer>
    </form>
    <script src="key-window.js"></script>
  </body>
</html>
