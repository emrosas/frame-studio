<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="color-scheme" content="light dark" />
    <title>Frame Studio</title>
    <!-- The viewer's look (src/viewer/style.css): warm neutrals, one orange accent, light and dark following the system. -->
    <style>
      :root {
        color-scheme: light dark;
        --accent: #ff5a1f;
        /* Dark enough for white text; the dot and logo keep the brand orange. */
        --accent-fill: #d4410a;
        --accent-fill-hover: #bf3a08;
        --bg: #fbfaf9;
        --side: #f4f3f0;
        --surface: #ffffff;
        --hover: #e9e7e3;
        --border: #e7e5e1;
        --border-strong: #d7d4ce;
        --text: #1c1b19;
        --muted: #6f6a63;
        --danger: #c2261d;
        --shadow: 0 1px 2px rgba(28, 27, 25, 0.05), 0 2px 8px rgba(28, 27, 25, 0.04);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --side: #1b1b1a;
          --surface: #272726;
          --hover: #30302e;
          --border: rgba(255, 255, 255, 0.075);
          --border-strong: rgba(255, 255, 255, 0.14);
          --text: #ededeb;
          --muted: #8d8a85;
          --danger: #f87171;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .logo {
          border-radius: 22%;
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 340px;
        background: var(--bg);
        color: var(--text);
        user-select: none;
        /* No title bar: the window drags from anywhere that isn't a control. */
        -webkit-app-region: drag;
      }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      .intro {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        padding: 40px 44px;
      }
      .logo {
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .tagline {
        margin: -10px 0 0;
        max-width: 300px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .actions {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }
      .action {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 280px;
        height: 38px;
        padding: 0 14px;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        background: var(--surface);
        font-weight: 500;
        text-align: left;
        box-shadow: var(--shadow);
      }
      .action:hover:not(:disabled) {
        background: var(--hover);
      }
      .action.primary {
        border-color: transparent;
        background: var(--accent-fill);
        color: #fff;
      }
      .action.primary:hover:not(:disabled) {
        background: var(--accent-fill-hover);
      }
      .action:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .action svg {
        flex: 0 0 auto;
      }
      .hint {
        margin: 0;
        max-width: 300px;
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        margin: 0;
        max-width: 300px;
        color: var(--danger);
        font-size: 12.5px;
      }
      .recent {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 44px 10px 12px;
        background: var(--side);
        border-left: 1px solid var(--border);
      }
      .recent h2 {
        margin: 0 0 6px;
        padding: 0 10px;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 500;
      }
      ul {
        display: grid;
        gap: 1px;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
      }
      ul button {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 10px;
        align-items: center;
        width: 100%;
        padding: 7px 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        text-align: left;
      }
      ul button:hover:not(:disabled) {
        background: var(--hover);
      }
      ul button svg {
        grid-row: span 2;
        color: var(--muted);
      }
      ul .name,
      ul .path {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      ul .name {
        font-weight: 500;
      }
      ul .path {
        color: var(--muted);
        font-size: 11.5px;
      }
      .update {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 280px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        font-size: 12.5px;
        box-shadow: var(--shadow);
      }
      .update::before {
        content: '';
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      .update.is-error::before {
        background: var(--danger);
      }
      .update span {
        flex: 1 1 auto;
      }
      .update button {
        flex: 0 0 auto;
        height: 26px;
        padding: 0 10px;
        border: none;
        border-radius: 7px;
        background: var(--accent-fill);
        color: #fff;
        font-size: 12px;
        font-weight: 500;
      }
      .empty {
        margin: 0;
        padding: 0 10px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .hint .link {
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="intro">
      <svg class="logo" width="56" height="56" viewBox="0 0 824 824" aria-hidden="true">
        <rect width="824" height="824" rx="190" fill="#111" />
        <path d="M162 308V162h146M516 162h146v146M662 516v146H516M308 662H162V516" fill="none" stroke="#f5f5f4" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="412" cy="412" r="116" fill="#ff5a1f" />
      </svg>
      <h1>Frame Studio</h1>
      <p class="tagline">Videos and images drawn in code. Point at what you see, and an agent changes it.</p>
      <div class="actions">
        <button type="button" class="action primary" id="new">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          New project…
        </button>
        <button type="button" class="action" id="open">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
          </svg>
          Open project…
        </button>
      </div>
      <p class="hint">Each project is a folder of its own. New to Frame Studio? <button type="button" class="link" id="sample">Open the sample project</button>: a simple scene, and a short film made of shots.</p>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="update" id="update" role="status" aria-label="Update" hidden><span id="update-text"></span><button type="button" id="update-go"></button></div>
    </main>
    <aside class="recent" aria-label="Recent projects">
      <h2>Recent</h2>
      <ul id="recent"></ul>
      <p class="empty" id="empty" hidden>Projects you open show up here.</p>
    </aside>
    <script src="welcome.js"></script>
  </body>
</html>
