<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Frame Studio</title>
    <style>
      :root {
        color-scheme: dark;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        background: #111213;
        color: #e4e5e7;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: 420px;
        display: grid;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #8b8f96;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #2a2c2f;
        background: #222427;
        color: #e4e5e7;
        cursor: pointer;
      }
      button.primary {
        background: #4da3ff;
        border-color: #4da3ff;
        color: #06121f;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      ul button {
        width: 100%;
        text-align: left;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .error {
        color: #ffc9cc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frame Studio</h1>
      <p>Animations drawn in code. Open a studio folder to start, or make a new one with two samples to play with.</p>
      <div class="actions">
        <button type="button" class="primary" id="new">New studio folder</button>
        <button type="button" id="open">Open folder…</button>
      </div>
      <section id="recent-section" hidden>
        <p>Recent</p>
        <ul id="recent"></ul>
      </section>
      <p class="error" id="error" role="alert" hidden></p>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
